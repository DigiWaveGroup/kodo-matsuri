<style>

:root{--void:#07051a;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--void);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

<body>
<canvas id="c" tabindex="0"></canvas>
<script>
'use strict';
/* ================================================================
   鼓動祭 KODŌ MATSURI — 和風太鼓節奏遊戲
   紅＝咚（F / J）  藍＝咔（D / K）
   ================================================================ */
const W=1280,H=720,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);scale=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);}
addEventListener('resize',resize);resize();

const F_BRUSH='"Yuji Syuku","Dela Gothic One","Hiragino Mincho ProN","Noto Serif TC",serif';
const F_BOLD='"Dela Gothic One","Zen Maru Gothic","PingFang TC","Noto Sans TC",sans-serif';
const F_UI='"Zen Maru Gothic","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const eOutC=t=>1-Math.pow(1-t,3),eInC=t=>t*t*t,eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOutBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const eOutBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const mtof=m=>440*Math.pow(2,(m-69)/12);
const rnd=(a,b)=>a+Math.random()*(b-a);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,font,fill,stroke,sw,align='center',base='middle'){
  ctx.font=size+'px '+font;ctx.textAlign=align;ctx.textBaseline=base;
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}
  if(fill){ctx.fillStyle=fill;ctx.fillText(s,x,y);}
}
let store={best:{},offset:0};
try{const s=JSON.parse(localStorage.getItem('kodo-matsuri')||'null');if(s)store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem('kodo-matsuri',JSON.stringify(store));}catch(e){}}

/* ================================================================
   AUDIO — 全部用 WebAudio 即時合成（太鼓、箏、三味線、尺八、拍子木…）
   ================================================================ */
let AC=null,master,musicBus,sfxBus,revIn,noiseBuf;
function initAudio(){
  if(AC){AC.resume();return;}
  AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
  master=AC.createGain();master.gain.value=.9;master.connect(comp);comp.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=.75;musicBus.connect(master);
  sfxBus=AC.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
  const len=AC.sampleRate*2.4,ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4);}
  const conv=AC.createConvolver();conv.buffer=ir;revIn=AC.createGain();revIn.gain.value=.45;revIn.connect(conv);conv.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  AC.resume();
}
const SFX={get dry(){return sfxBus},get wet(){return revIn}};
function out(node,P,wet){node.connect(P.dry);if(wet){const g=AC.createGain();g.gain.value=wet;node.connect(g);g.connect(P.wet);}}
function envG(t,a,peak,d){const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);return g;}
function osc(type,f,t,stop){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(stop);return o;}
function noise(t,dur){const n=AC.createBufferSource();n.buffer=noiseBuf;n.start(t,Math.random()*1.4,dur);return n;}
function filt(type,f,q){const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!=null)b.Q.value=q;return b;}
function chain(...n){for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1];}

const INS={
  don(t,P,v=1){const o=osc('sine',175,t,t+.75);o.frequency.exponentialRampToValueAtTime(48,t+.24);
    out(chain(o,envG(t,.003,.95*v,.62)),P,.22);
    const o2=osc('triangle',98,t,t+.3);o2.frequency.exponentialRampToValueAtTime(58,t+.2);out(chain(o2,envG(t,.002,.35*v,.24)),P,0);
    out(chain(noise(t,.12),filt('lowpass',1100),envG(t,.001,.55*v,.09)),P,.2);},
  ka(t,P,v=1){out(chain(osc('square',800,t,t+.12),filt('bandpass',1650,3),envG(t,.001,.38*v,.07)),P,.2);
    out(chain(osc('sine',2380,t,t+.08),envG(t,.001,.22*v,.04)),P,.1);
    out(chain(noise(t,.06),filt('bandpass',3300,1.5),envG(t,.001,.7*v,.035)),P,.15);},
  shime(t,P,v=1){const o=osc('sine',540,t,t+.16);o.frequency.exponentialRampToValueAtTime(330,t+.08);out(chain(o,envG(t,.001,.38*v,.11)),P,.1);
    out(chain(noise(t,.05),filt('bandpass',2700,2),envG(t,.001,.3*v,.03)),P,0);},
  kick(t,P,v=1){const o=osc('sine',145,t,t+.4);o.frequency.exponentialRampToValueAtTime(40,t+.12);out(chain(o,envG(t,.002,.9*v,.3)),P,0);},
  snare(t,P,v=1){out(chain(noise(t,.24),filt('bandpass',1900,.8),envG(t,.001,.6*v,.18)),P,.25);out(chain(osc('triangle',210,t,t+.12),envG(t,.001,.4*v,.08)),P,0);},
  clap(t,P,v=1){for(let i=0;i<3;i++){const tt=t+i*.011;out(chain(noise(tt,.14),filt('bandpass',1500,1.2),envG(tt,.001,.45*v,i===2?.13:.02)),P,.3);}},
  hat(t,P,v=1){out(chain(noise(t,.07),filt('highpass',7600),envG(t,.001,.2*v,.04)),P,0);},
  ohat(t,P,v=1){out(chain(noise(t,.3),filt('highpass',7000),envG(t,.001,.16*v,.22)),P,.1);},
  hyoshigi(t,P,v=1){[2150,3320,4750].forEach((f,i)=>out(chain(osc('sine',f,t,t+.2),envG(t,.0008,[.45,.25,.12][i]*v,.09)),P,.6));
    out(chain(noise(t,.03),filt('highpass',3000),envG(t,.0005,.4*v,.02)),P,.5);},
  gong(t,P,v=1){[110,163,231,297,412,523].forEach((f,i)=>out(chain(osc('sine',f*(1+Math.random()*.004),t,t+3.4),envG(t,.01,.2*v/(i*.6+1),3-i*.35)),P,.5));
    out(chain(noise(t,.45),filt('lowpass',650),envG(t,.004,.3*v,.38)),P,.4);},
  furin(t,P,v=1){const f0=2300+Math.random()*900;[1,2.76,5.4].forEach((m,i)=>out(chain(osc('sine',f0*m,t,t+2.1),envG(t,.002,.07*v/(i+1),1.7-i*.4)),P,.8));},
  koto(t,P,m,d,v=1){const f=mtof(m);const lp=filt('lowpass',f*8,3);lp.frequency.setValueAtTime(Math.min(f*11,10000),t);lp.frequency.exponentialRampToValueAtTime(f*1.6,t+.55);
    const g=envG(t,.002,.26*v,1.25);osc('sawtooth',f,t,t+1.5).connect(lp);osc('triangle',f*2.003,t,t+1.2).connect(lp);lp.connect(g);out(g,P,.35);},
  shamisen(t,P,m,d,v=1){const f=mtof(m);const o=osc('sawtooth',f*1.025,t,t+.75);o.frequency.exponentialRampToValueAtTime(f,t+.035);
    const pk=filt('peaking',f*4,2);pk.gain.value=9;out(chain(o,filt('highpass',f*1.4,.7),pk,envG(t,.001,.34*v,.42)),P,.25);
    out(chain(noise(t,.03),filt('bandpass',3200,1),envG(t,.0005,.28*v,.02)),P,0);},
  flute(t,P,m,d,v=1){const f=mtof(m),dur=Math.max(.15,d),end=t+dur+.3;const o=osc('sine',f*.965,t,end);o.frequency.exponentialRampToValueAtTime(f,t+.08);
    const lfo=osc('sine',5.3,t,end),lg=AC.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.016,t+Math.min(.45,dur));lfo.connect(lg);lg.connect(o.frequency);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2*v,t+.06);g.gain.setValueAtTime(.18*v,t+dur);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.24);
    o.connect(g);const o2=osc('triangle',f*2,t,end),g2=AC.createGain();g2.gain.value=.12;o2.connect(g2);g2.connect(g);out(g,P,.5);
    out(chain(noise(t,Math.min(dur+.2,.55)),filt('bandpass',f*2,2),envG(t,.03,.06*v,dur*.8+.1)),P,.3);},
  bass(t,P,m,d,v=1){const f=mtof(m);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5*v,t+.01);g.gain.exponentialRampToValueAtTime(.22*v,t+d*.6+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+.08);
    const lp=filt('lowpass',650);osc('triangle',f,t,t+d+.12).connect(lp);osc('sine',f,t,t+d+.12).connect(lp);lp.connect(g);out(g,P,0);},
  pad(t,P,m,d,v=1){[m,m+7,m+12].forEach(mm=>[-7,7].forEach(det=>{const o=osc('sawtooth',mtof(mm),t,t+d+.7);o.detune.value=det;
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.022*v,t+.4);g.gain.setValueAtTime(.022*v,t+d);g.gain.exponentialRampToValueAtTime(.0001,t+d+.6);
    out(chain(o,filt('lowpass',950),g),P,.5);}));},
  kakegoe(t,P,v=1,hi){const o=osc('sawtooth',hi?320:235,t,t+.65);o.frequency.exponentialRampToValueAtTime(hi?560:430,t+.16);o.frequency.exponentialRampToValueAtTime(hi?400:300,t+.55);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(2.2*v,t+.04);g.gain.setValueAtTime(1.9*v,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+.58);
    o.connect(filt('bandpass',760,6)).connect(g);o.connect(filt('bandpass',1180,7)).connect(g);out(g,P,.35);},
  boom(t,P,v=1){out(chain(noise(t,.9),filt('lowpass',380),envG(t,.004,.5*v,.8)),P,.5);out(chain(osc('sine',62,t,t+.6),envG(t,.003,.4*v,.5)),P,0);},
  crackle(t,P,v=1){for(let i=0;i<9;i++){const tt=t+.25+Math.random()*.5;out(chain(noise(tt,.02),filt('highpass',4000),envG(tt,.0005,.12*v,.015)),P,.4);}},
  whoosh(t,P,v=1,dur=.5){const f=filt('bandpass',300,1.4);f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3500,t+dur);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5*v,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);out(chain(noise(t,Math.min(dur,.6)),f,g),P,.3);},
  tick(t,P,v=1){out(chain(osc('sine',1800,t,t+.04),envG(t,.001,.12*v,.025)),P,0);},
};
function sfx(name,delay=0,...a){if(!AC)return;INS[name](AC.currentTime+delay,SFX,...a);}
function sfxNote(name,m,delay=0,d=.4,v=1){if(!AC)return;INS[name](AC.currentTime+delay,SFX,m,d,v);}

/* ---------- 曲目 & 自動作曲 ---------- */
const SONGS=[
  {id:'sakura',title:'桜吹雪',en:'SAKURA FUBUKI',desc:'春夜・櫻花祭典',bpm:126,root:62,scale:[0,2,5,7,9],seed:7,style:'festival',lead:'koto',lead2:'flute',
   prog:{A:[0,0,5,7],B:[5,7,0,0],C:[0,5,7,0]},stars:[2,4,7],theme:'sakura',col:'#ff86b4'},
  {id:'kitsune',title:'狐火ノ夜',en:'KITSUNEBI',desc:'狐之嫁入・鬼火夜行',bpm:148,root:64,scale:[0,1,5,7,8],seed:31,style:'festival',lead:'shamisen',lead2:'flute',
   prog:{A:[0,0,8,7],B:[5,5,8,7],C:[0,8,5,7]},stars:[3,6,8],theme:'kitsune',col:'#5ee6ff'},
  {id:'raijin',title:'雷神ラッシュ',en:'RAIJIN RUSH',desc:'雷鳴轟く・最終試煉',bpm:176,root:62,scale:[0,2,3,7,8],seed:58,style:'rock',lead:'shamisen',lead2:'koto',
   prog:{A:[0,0,8,7],B:[8,7,3,7],C:[0,8,3,7]},stars:[4,7,10],theme:'raijin',col:'#ffd23f'},
];
const DIFFS=[{k:'梅',n:'かんたん',zh:'簡單',col:'#ff8fb1'},{k:'竹',n:'ふつう',zh:'普通',col:'#66d17a'},{k:'鬼',n:'おに',zh:'魔王',col:'#d23cff'}];
const FORM=[['intro',4],['A',8],['B',4],['C',8],['A',8],['B',4],['C',8],['end',2]];
const RHY={
  calm:['x.......x.......','x.......x...x...','x...........x...','x.......x.x.....','x...x.......x...'],
  mid:['x...x...x.x.x...','x..x..x.x...x...','x...x.x.x...x...','x.x.x...x...x.x.','x...x...x.x.x.x.','x..x..x...x.x...'],
  hi:['x.x.x.xxx.x.x...','x.xxx.x.x.xxx.x.','xx.x.x.xx.x.x.x.','x.x.xx.x.x.xx...','x..x..x.x.x.xxx.','x.x.x.x.xx.xx.x.'],
};
function makeMotif(r,energy){const notes=[];let d=6+Math.floor(r()*3);
  for(let bar=0;bar<2;bar++){const pat=pick(r,RHY[energy]);const on=[];for(let s=0;s<16;s++)if(pat[s]==='x')on.push(s);
    on.forEach((s,i)=>{const nx=i+1<on.length?on[i+1]:16;d=clamp(d+pick(r,[-2,-1,-1,0,1,1,2]),4,11);notes.push({s:bar*16+s,d,l:nx-s});});}
  return notes;}
function vary(r,m){return m.map(n=>n.s>=16?{...n,d:clamp(n.d+pick(r,[-1,1,2]),4,11)}:{...n});}
function cadence(r,m){const v=vary(r,m);const l=v[v.length-1];l.d=5;l.l=Math.max(l.l,4);return v;}

function buildSong(def){
  const r=mulberry32(def.seed),ev=[],mel=[],secs=[],n=def.scale.length;
  const add=(b,i,p={})=>ev.push({b,i,p});
  const d2m=d=>{const o=Math.floor(d/n),i=((d%n)+n)%n;return def.root-12+o*12+def.scale[i];};
  const mot={A:makeMotif(r,'mid'),B:makeMotif(r,'calm'),C:makeMotif(r,'hi')};
  const phr={};for(const k in mot)phr[k]=[mot[k],vary(r,mot[k]),mot[k],cadence(r,mot[k])];
  const rock=def.style==='rock';
  let bar=0;
  for(const [sec,len] of FORM){
    secs.push({name:sec,bar,len});
    for(let k=0;k<len;k++,bar++){
      const B=bar*4,last=k===len-1;
      const P=(pat,inst,v)=>{for(let s=0;s<16;s++)if(pat[s]!=='.')add(B+s/4,inst,{v:pat[s]==='X'?v*1.3:v});};
      const pr=(def.prog[sec]||[0])[k%4]||0,bm=def.root-24+pr;
      if(sec==='intro'){
        if(k===0){add(B,'hyoshigi');add(B+2,'hyoshigi');add(B,'pad',{m:def.root-12,d:8,v:.8});}
        else if(k===1)P('x...x..x.x.xxxxx','hyoshigi',.85);
        else{P(k===2?'X...x...x.x.x...':'X.x.x.x.x.xxX...','don',.85);P('..x...x...x...x.','shime',.35);
          if(rock)P('x...x...x...x...','kick',.7);
          add(B,'bass',{m:def.root-24,d:2,v:.8});add(B+2,'bass',{m:def.root-24+7,d:2,v:.8});
          if(k===3){add(B+3.5,'kakegoe',{v:1});}}
      }else if(sec==='end'){
        if(k===0){[0,1,2].forEach(x=>{add(B+x,'don',{v:1.2});add(B+x,'kick',{v:1});add(B+x,def.lead,{m:def.root+[0,5,7][x],d:1});});P('............xxxx','shime',.5);}
        else{add(B,'don',{v:1.4});add(B,'gong',{v:1});add(B,'kick',{v:1});add(B,def.lead,{m:def.root+12,d:4});add(B,'flute',{m:def.root+12,d:4,v:.7});add(B,'bass',{m:def.root-24,d:4});}
      }else{
        // 打擊
        if(sec==='A'){
          if(rock){P('x.....x.x.......','kick',.9);P('....x.......x...','snare',.8);P('x.x.x.x.x.x.x.x.','hat',.8);P('X...............','don',.7);}
          else{P('X..x..x.X.......','don',.75);P('..x...x...x...x.','shime',.35);P('x.......x.......','kick',.55);P('x.x.x.x.x.x.x.x.','hat',.55);}
          if(k===0)add(B,'gong',{v:.5});
        }else if(sec==='B'){
          if(rock){P('x.......x.......','kick',.8);P('........x.......','snare',.7);P('x...x...x...x...','hat',.6);}
          else P('X...............','don',.6);
          if(k%2===1&&!last)add(B+3,'hyoshigi',{v:.6});
          add(B+Math.floor(r()*4)+.5,'furin',{v:.8});
          add(B,'pad',{m:bm+24,d:4,v:1});
          if(last)for(let s=0;s<16;s++)add(B+s/4,'shime',{v:.15+s*.028});
        }else{ // C
          if(rock){P('x...x...x...x.x.','kick',1);P('....X.......X...','snare',.85);P('xxxxxxxxxxxxxxxx','hat',.45);P('X.......X.......','don',.8);P('..x...x...x...x.','ohat',.8);}
          else{P('X..x..x.X.x.x...','don',.9);P('x...x...x...x...','kick',.75);P('....x.......x...','clap',.6);P('x.x.x.x.x.x.x.x.','hat',.5);P('..x...x...x...x.','ohat',.6);}
          if(k===0){add(B,'gong',{v:.9});add(B-.5,'kakegoe',{v:1,o:true});}
          if(k%2===1&&!last)P('............xxxx','shime',.45);
          add(B,'pad',{m:bm+24,d:4,v:.7});
        }
        if(last&&sec!=='B'){P('........x.x.xxXX','don',.7);P('........xxxxxxxx','shime',.35);}
        // 旋律
        const m=phr[sec][Math.floor(k/2)%4],half=k%2;
        for(const nt of m)if(nt.s>=half*16&&nt.s<half*16+16){
          const b=B+(nt.s-half*16)/4,midi=d2m(nt.d)+(sec==='B'?12:0);
          add(b,sec==='B'?'flute':def.lead,{m:midi,d:nt.l/4,v:sec==='C'?1.05:.95});
          if(sec==='C'&&def.lead2)add(b,def.lead2,{m:midi+12,d:nt.l/4,v:.32});

function buildChart(song,diff){
  const spb=song.spb,o=[],minGap=[1,.5,.25][diff];
  const push=(b,type,big=false,endB=null)=>o.push({b,t:b*spb,type,big,endB,end:endB!=null?endB*spb:0,judged:false,res:null,hits:0});
  const intro=[['x.......x.......','x.......x.......'],['x...x...x...x...','x...x...x.x.x...'],['x...x...x.x.x...','x.x.x.x.x.xxx...']][diff];
  [2,3].forEach((bar,i)=>{for(let s=0;s<16;s++)if(intro[i][s]==='x')push(bar*4+s/4,diff===2&&s%4===2?'k':'d',i===1&&s===12&&diff>0);});
  let prevM=null,lastB=-9,lastType='d';
  for(const m of song.mel){
    const s=m.s;let keep=diff===2?true:diff===1?s%2===0:(m.sec==='C'?s%4===0:s%8===0);
    if(m.sec==='B'){keep=diff===0?s%4===0:true;if(m.k===m.len-1)keep=false;}
    if(!keep||m.b-lastB<minGap-1e-6)continue;
    let type='d';
    if(prevM!=null){const up=m.m-prevM;type=diff===0?(up>=4?'k':'d'):(up>0?'k':up<0?'d':lastType);}
    prevM=m.m;lastType=type;
    const big=s===0&&((m.sec==='C'&&m.k%4===0)||(m.sec==='A'&&m.k===0));
    push(m.b,type,big);lastB=m.b;
  }
  for(const sc of song.secs){
    if(sc.name==='C'&&diff>0)for(let k=1;k<sc.len-1;k+=2){const bb=(sc.bar+k)*4;
      const xs=diff===2?[3,3.25,3.5,3.75]:[3.5];xs.forEach((x,i)=>{if(!o.some(n=>Math.abs(n.b-(bb+x))<.2))push(bb+x,i%2?'k':'d');});}
  }
  const rolls=[];for(const sc of song.secs)if(sc.name==='B'){const b0=(sc.bar+sc.len-1)*4;rolls.push([b0,b0+3]);}
  let res=o.filter(n=>!rolls.some(([a,e])=>n.b>a-.6&&n.b<e+.6));
  rolls.forEach(([a,e])=>{res.push({b:a,t:a*spb,type:'r',big:false,endB:e,end:e*spb,judged:false,res:null,hits:0});});
  const eb=secOf(song,'end').bar*4;
  res=res.filter(n=>n.b<eb-.4);
  [[0,'d',false],[1,'d',false],[2,'d',true],[4,'d',true]].forEach(([x,t,b])=>res.push({b:eb+x,t:(eb+x)*spb,type:t,big:b,endB:null,end:0,judged:false,res:null,hits:0}));
  res.sort((a,b)=>a.b-b.b);
  return res.filter((n,i)=>i===0||Math.abs(n.b-res[i-1].b)>.01);
}

class Player{
  constructor(song,from=0,loop=null){this.s=song;this.ev=song.events;this.spb=song.spb;this.from=from;this.loop=loop;
    this.g=AC.createGain();this.g.connect(musicBus);this.P={dry:this.g,wet:revIn};this.stopped=false;}
  start(when){this.base=when-this.from*this.spb;this.idx=this.ev.findIndex(e=>e.b>=this.from);if(this.idx<0)this.idx=this.ev.length;return this;}
  beat(){return(AC.currentTime-this.base)/this.spb;}
  tick(){if(this.stopped)return;const hz=AC.currentTime+.18;
    for(let guard=0;guard<400;guard++){let e=this.ev[this.idx];
      if(this.loop&&(!e||e.b>=this.loop[1])){this.base+=(this.loop[1]-this.loop[0])*this.spb;this.idx=this.ev.findIndex(x=>x.b>=this.loop[0]);e=this.ev[this.idx];}
      if(!e)break;const tt=this.base+e.b*this.spb;if(tt>hz)break;
      if(tt>=AC.currentTime-.03){const p=e.p,f=INS[e.i];if(p.m!=null)f(tt,this.P,p.m,(p.d||1)*this.spb,p.v??1);else f(tt,this.P,p.v??1,p.o);}
      this.idx++;}}
  stop(fade=.35){if(this.stopped)return;this.stopped=true;const t=AC.currentTime;this.g.gain.setValueAtTime(this.g.gain.value,t);this.g.gain.linearRampToValueAtTime(.0001,t+fade);
    setTimeout(()=>{try{this.g.disconnect()}catch(e){}},fade*1000+600);}
}

function brushStroke(x,y,w,h,p,col='#0b0b0b',seed=1){if(p<=0)return;const r=mulberry32(seed),xe=x+w*p,N=40;ctx.fillStyle=col;ctx.beginPath();

    top.push([xx,y-h/2*taper+(r()-.5)*h*.12]);bot.push([xx,y+h/2*taper+(r()-.5)*h*.12]);}
  ctx.moveTo(...top[0]);top.forEach(p=>ctx.lineTo(...p));bot.reverse().forEach(p=>ctx.lineTo(...p));ctx.fill();
  ctx.strokeStyle=col;for(let i=0;i<14;i++){const yy=y+(r()-.5)*h*.95,len=w*p*(.15+r()*.25);ctx.lineWidth=1+r()*3;ctx.beginPath();ctx.moveTo(xe-len*.2,yy);ctx.lineTo(xe+len*.35*r(),yy+(r()-.5)*4);ctx.stroke();}}

const bgP=[],fxP=[];
function P(o){const p=Object.assign({x:0,y:0,vx:0,vy:0,ay:0,drag:0,life:1,age:0,size:4,rot:0,vr:0,color:'#fff',seed:Math.random()*10},o);(o.bg?bgP:fxP).push(p);return p;}
function updParts(arr,dt){for(let i=arr.length-1;i>=0;i--){const p=arr[i];p.age+=dt;
  if(p.age>=p.life){arr.splice(i,1);if(p.onEnd)p.onEnd(p);continue;}
  if(p.kind==='fly')continue;
  p.vy+=p.ay*dt;if(p.drag){const f=Math.exp(-p.drag*dt);p.vx*=f;p.vy*=f;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  if(p.kind==='petal')p.x+=Math.sin(p.age*2+p.seed)*30*dt;
  if(p.kind==='fw'&&Math.random()<.3&&p.age<p.life*.8)p.tw=Math.random();}}
function drawParts(arr){for(const p of arr){const k=p.age/p.life;ctx.save();
  switch(p.kind){
    case 'spark':ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1-k;ctx.strokeStyle=p.color;ctx.lineWidth=p.size*(1-k)+.6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();break;

      ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-k*.5),0,TAU);ctx.fill();ctx.strokeStyle=p.color;ctx.lineWidth=p.size*.7;ctx.globalAlpha*=.4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.08,p.y-p.vy*.08);ctx.stroke();break;
    case 'rocket':ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ffe9b0';ctx.beginPath();ctx.arc(p.x,p.y,3,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,200,120,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y+30);ctx.stroke();break;
    case 'ring':ctx.globalAlpha=(1-k)*(p.alpha??1);if(p.add)ctx.globalCompositeOperation='lighter';ctx.strokeStyle=p.color;ctx.lineWidth=p.lw*(1-k)+1;ctx.beginPath();ctx.arc(p.x,p.y,p.size+p.grow*eOutC(k),0,TAU);ctx.stroke();break;
    case 'flower':ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1-k;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;
      {const s=p.size*(.6+eOutC(k)*.9);for(let i=0;i<8;i++){ctx.rotate(TAU/8);ctx.beginPath();ctx.ellipse(0,-s*.62,s*.16,s*.4,0,0,TAU);ctx.fill();}}break;
    case 'petal':ctx.globalAlpha=Math.min(1,(p.life-p.age)*1.5)*(p.alpha??.9);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.sin(p.age*3+p.seed)*.8+.2);
      ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(0,-p.size);ctx.quadraticCurveTo(p.size*.9,0,0,p.size);ctx.quadraticCurveTo(-p.size*.9,0,0,-p.size);ctx.fill();break;
    case 'ink':ctx.globalAlpha=k<.7?1:(1-k)/.3;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*Math.min(1,k*8),0,TAU);ctx.fill();break;
    case 'text':{const s=k<.12?lerp(1.7,1,eOutC(k/.12)):1;ctx.globalAlpha=k>.65?(1-k)/.35:1;ctx.translate(p.x,p.y);ctx.scale(s,s);
      txt(p.text,0,0,p.size,p.font||F_BOLD,p.color,p.stroke||'#111',p.sw??p.size*.18);break;}
    case 'fly':{const e=eInOut(k),x0=p.x0,y0=p.y0,x1=p.tx(),y1=p.ty,cx=(x0+x1)/2,cy=y0-260;const x=(1-e)*(1-e)*x0+2*(1-e)*e*cx+e*e*x1,y=(1-e)*(1-e)*y0+2*(1-e)*e*cy+e*e*y1;

    case 'wisp':{ctx.globalCompositeOperation='lighter';const fl=.8+Math.sin(p.age*12+p.seed)*.2,a=Math.min(1,p.age*2,(p.life-p.age)*2);

    case 'confetti':ctx.globalAlpha=Math.min(1,(p.life-p.age)*2);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(Math.sin(p.age*8+p.seed),1);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size*.3,p.size,p.size*.6);break;
    case 'rain':ctx.globalAlpha=.35;ctx.strokeStyle='#b8c8ff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();break;
  }ctx.restore();}}

function songT(){return AC.currentTime-G.t0-(AC.outputLatency||AC.baseLatency||0)+store.offset/1000;}
function startGame(si,di,delay){const song=SONGS[si],chart=buildChart(song,di);

function judgeText(res,big){const m={good:['良','#ffd84a','GOOD'],ok:['可','#ffffff','OK'],bad:['不可','#7f9cff','MISS'],miss:['不可','#7f9cff','MISS']}[res];
  G.judge={ch:m[0],col:m[1],en:m[2],t:0};}
function breakCombo(){if(G.combo>=30){P({kind:'text',text:G.combo+' 連擊 中斷',x:150,y:356,size:18,color:'#ccd',font:F_UI,life:.9,vy:-20});}G.combo=0;}
function judgeMiss(n){n.judged=true;n.res='miss';G.bad++;breakCombo();addGauge(-G.gainUnit*1.6);judgeText('miss');}
function judge(n,d,kind,side){const w=WIN[G.di],a=Math.abs(d),res=a<=w.g?'good':a<=w.o?'ok':'bad';n.judged=true;n.res=res;judgeText(res);
  if(res==='bad'){G.bad++;breakCombo();addGauge(-G.gainUnit*1.6);return;}
  G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.comboPop=1;res==='good'?G.good++:G.ok++;
  G.score+=(res==='good'?1000:500)+Math.min(G.combo,100)*8;
  addGauge((res==='good'?1:.5)*G.gainUnit);
  if(n.big)G.lastBig={n,kind,side,t:songT()};
  hitFX(n,res);
  if(G.combo%50===0){bannerShow(G.combo+' コンボ！',G.combo+' COMBO');sfx('kakegoe',0,1,G.combo>=100);sfx('hyoshigi',.0,.8);sfx('hyoshigi',.12,.8);}}

  const c=kind==='ka'?'#5fd6ff':'#ffb020';P({kind:'ring',x:JX,y:LANE_Y,size:26,grow:50,lw:6,color:c,life:.22,add:true});
  for(let i=0;i<5;i++){const a=Math.random()*TAU,sp=rnd(200,450);P({kind:'spark',x:JX,y:LANE_Y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,drag:5,life:.3,size:3,color:'#ffe08a'});}

function hit(kind,side){
  if(!AC)return;(kind==='don'?INS.don:INS.ka)(AC.currentTime,SFX,.95);drumFlash[kind+side]=1;
  if(!G||scene!=='play'||G.ending||G.paused)return;
  const t=songT(),w=WIN[G.di];
  if(G.lastBig&&G.lastBig.kind===kind&&G.lastBig.side!==side&&t-G.lastBig.t<.09){G.score+=G.lastBig.n.res==='good'?1000:500;
    P({kind:'text',text:'大！',x:JX+58,y:LANE_Y-50,size:30,color:'#ffd84a',life:.5,vy:-40});P({kind:'ring',x:JX,y:LANE_Y,size:50,grow:110,lw:10,color:'#ffd84a',life:.4,add:true});
    shake=Math.max(shake,9);G.lastBig=null;return;}
  for(let i=G.idx;i<G.chart.length;i++){const n=G.chart[i];if(n.judged)continue;
    if(n.type==='r'){if(t>=n.t-.03&&t<=n.end){rollHit(n,kind);return;}if(n.t-.03>t)return;continue;}
    const d=t-n.t;if(d<-w.b)return;if(d>w.o)continue;

}
function updatePlay(dt){
  if(G.paused)return;
  G.player.tick();
  const t=songT(),w=WIN[G.di],spb=G.song.spb,beat=t/spb;
  if(G.auto){for(let i=G.idx;i<G.chart.length;i++){const n=G.chart[i];if(n.judged)continue;if(n.t>t+.01)break;
      if(n.type==='r'){if(t<=n.end){G.autoRoll-=dt;if(G.autoRoll<=0){G.autoRoll=.065;hit(n.hits%2?'ka':'don',n.hits%2?'R':'L');}}break;}
      const k=n.type==='k'?'ka':'don';hit(k,'L');if(n.big)hit(k,'R');break;}}
  while(G.idx<G.chart.length){const n=G.chart[G.idx];if(n.judged){G.idx++;continue;}
    if(n.type==='r'){if(t>n.end){n.judged=true;G.idx++;continue;}break;}

function menuAct(code){if(code==='ArrowLeft'||code==='KeyD')return'left';if(code==='ArrowRight'||code==='KeyK')return'right';if(code==='ArrowUp')return'up';if(code==='ArrowDown')return'down';

function onAction(a,code){
  if(scene==='boot'){boot();return;}
  if(trans&&trans.kind!=='ink')return;if(trans)return;
  if(scene==='intro'){toTitle();return;}
  if(scene==='title'){if(a||code){sfx('don');sfx('don',.12);inkWipe(()=>{go('select');startPreview(sel.song);});}return;}
  if(scene==='select'){
    if(a==='left'||a==='right'){sel.song=(sel.song+(a==='left'?-1:1)+SONGS.length)%SONGS.length;sfx('ka');previewTimer=.35;}
    else if(a==='up'||a==='down'){sel.diff=clamp(sel.diff+(a==='up'?1:-1),0,2);sfx('ka');}
    else if(a==='ok'){sfx('don');doorsTo(sel.song,sel.diff);}
    else if(a==='back'){sfx('hyoshigi');inkWipe(()=>{go('title');startPreview(0,'A');});}
    else if(code==='BracketLeft'||code==='Minus'){store.offset=clamp(store.offset-5,-200,200);save();sfx('tick');}
    else if(code==='BracketRight'||code==='Equal'){store.offset=clamp(store.offset+5,-200,200);save();sfx('tick');}
    else if(code==='KeyA'){sel.auto=!sel.auto;sfx('shime');}
    return;}
  if(scene==='play'&&G&&G.paused){
    if(a==='up'||a==='left'){G.pausedSel=(G.pausedSel+2)%3;}else if(a==='down'||a==='right'){G.pausedSel=(G.pausedSel+1)%3;}
    else if(a==='back'){resumeGame();}
    else if(a==='ok'){[resumeGame,()=>quitGame(false),()=>quitGame(true)][G.pausedSel]();}
    return;}
  if(scene==='result'){if(sceneT<1.2)return;
    if(code==='KeyR'){sfx('don');doorsTo(R.si,R.di);}
    else if(a==='ok'||a==='back'){sfx('don');inkWipe(()=>{go('select');startPreview(sel.song);});}}
}

  txt('得点',80,262,22,F_BRUSH,'#7a3a1a',null,0,'left');txt(String(sc).padStart(7,'0'),170,264,64,F_BOLD,'#1a0a06',null,0,'left');
  if(r.newBest&&t>1.4){ctx.save();ctx.translate(500,232);ctx.rotate(-.12);rr(-6,-16,128,32,6);ctx.fillStyle='#c8102e';ctx.fill();txt('自己最佳！',58,1,17,F_BOLD,'#fff');ctx.restore();}
  const rows=[['良','GOOD',r.good,'#c88a00'],['可','OK',r.ok,'#5a5a5a'],['不可','MISS',r.bad,'#3a5ac8'],['連打','ROLL',r.roll,'#d85a0a'],['最大連擊','MAX COMBO',r.maxCombo,'#8a1a1a']];
  rows.forEach(([a,b,v,c],i)=>{const tt=t-.5-i*.15;if(tt<0)return;const k=eOutC(clamp(tt/.3,0,1));ctx.save();ctx.globalAlpha=k;ctx.translate((1-k)*-60,0);const y=332+i*58;
    ctx.fillStyle='rgba(120,60,20,.08)';ctx.fillRect(70,y-24,520,48);txt(a,90,y,30,F_BRUSH,c,null,0,'left');txt(b,90+(a.length*32)+14,y+4,13,F_BOLD,'#8a6a4a',null,0,'left');
    txt(String(v),570,y,34,F_BOLD,'#1a0a06',null,0,'right');ctx.restore();});
  txt('達成率 '+(r.acc*100).toFixed(1)+'%',330,H-80,18,F_UI,'#6a4a2a');
  // daruma
  const dk=clamp((t-.3)/.5,0,1);if(dk>0){const eye=r.clear?(t>2.2?2:1):1;const bounce=r.clear&&t>2.2?Math.abs(Math.sin(t*5))*12:0;
    drawDaruma(800,600-bounce,1.7*eOutBack(dk),eye,r.clear?Math.sin(t*3)*.05:-.08,0,0);
    if(r.clear&&t>1.95&&t<2.5){const k=(t-1.95)/.55;ctx.save();ctx.strokeStyle='#0b0b0b';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.arc(800+12*1.7,600-66*1.7,9*k*1.7,0,TAU*k);ctx.stroke();ctx.restore();}
    if(!r.clear&&t>2){ctx.fillStyle='#6ac0ff';ctx.beginPath();ctx.ellipse(800+26,600-90+((t*40)%30),4,7,0,0,TAU);ctx.fill();}
    txt(r.clear?'願望成真！雙眼點睛':'差一點…再挑戰吧',800,H-72,20,F_UI,r.clear?'#a8141e':'#4a5a8a');}
  // stamp
  if(t>1.55){const k=clamp((t-1.55)/.16,0,1),s=lerp(3.2,1,eInC(k));ctx.save();ctx.globalAlpha=k;ctx.translate(1060,300);ctx.scale(s,s);
    hanko(0,0,230,r.rank,-.12,r.rank==='極'?'#b8860b':r.rank==='惜'?'#4a5a8a':'#c8102e',r.rank.charCodeAt(0));ctx.restore();
    if(!r.fx.stamp&&k>=1){r.fx.stamp=1;shake=20;sfx('don',0,1.4);sfx('kick',0,1);sfx('gong',0,r.clear?.8:.4);inkBurst(1060,300,40,r.clear?['#c8102e','#0b0b0b']:['#4a5a8a','#0b0b0b'],1.2);
      if(r.clear){[0,1,2,3].forEach(i=>setTimeout(()=>{if(scene==='result')rocket(rnd(700,1240),rnd(120,300),.9);},i*220));
        [0,2,4,7,9,12].forEach((o,i)=>sfxNote('koto',song.root+o,.25+i*.09,.4,.8));sfx('kakegoe',.2,1,true);}
      else [12,8,7,5,0].forEach((o,i)=>sfxNote('flute',song.root+o,.3+i*.22,.3,.8));}
    if(t>1.8){const a=clamp((t-1.8)/.3,0,1);ctx.globalAlpha=a;txt(r.clear?'ノルマクリア！':'未達成…',1060,460,32,F_BRUSH,r.clear?'#c8102e':'#4a5a8a');ctx.globalAlpha=1;}}
  if(r.fc&&t>2.3){const k=eOutBack(clamp((t-2.3)/.3,0,1));ctx.save();ctx.translate(1060,140);ctx.scale(k,k);
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(-60,20);ctx.lineTo(-70,-24);ctx.lineTo(-35,0);ctx.lineTo(0,-36);ctx.lineTo(35,0);ctx.lineTo(70,-24);ctx.lineTo(60,20);ctx.closePath();ctx.fill();ctx.strokeStyle='#8a5a00';ctx.lineWidth=3;ctx.stroke();
    txt(r.allGood?'全良':'全連',0,4,24,F_BRUSH,'#7a1a00');ctx.restore();}
  if(r.auto)txt('（自動演奏・不計紀錄）',1060,500,14,F_UI,'#8a6a4a');
  if(t>2.6){ctx.globalAlpha=.6+.4*Math.sin(t*4);txt('Enter 回到選曲　　R 再挑戰一次',W/2+300,H-23,18,F_UI,'#fff','#1a0606',4);ctx.globalAlpha=1;}}

/* --- transitions draw --- */
function drawTransition(){const tr=trans,t=tr.t;
  if(tr.kind==='ink'){const k=t/tr.dur;const p=k<.5?eInC(k*2):1-eOutC((k-.5)*2);const R0=Math.hypot(W,H)*.62*p;
    ctx.fillStyle='#08050c';ctx.beginPath();const r=mulberry32(5);for(let i=0;i<=48;i++){const a=i/48*TAU,rr2=R0*(1+(r()-.5)*.16);i?ctx.lineTo(640+Math.cos(a)*rr2,360+Math.sin(a)*rr2):ctx.moveTo(640+Math.cos(a)*rr2,360+Math.sin(a)*rr2);}ctx.fill();
    if(p>.6){ctx.globalAlpha=(p-.6)/.4;drawTomoe(640,360,60,'#c8102e',t*6);ctx.globalAlpha=1;}return;}
  if(tr.kind==='doors'){const close=t<.45?eInC(t/.45):t<2.25?1:1-eInOut(clamp((t-2.25)/.6,0,1));const hw=W/2;
    for(const side of [-1,1]){ctx.save();const x=side<0?-hw+hw*close:W-hw*close;ctx.translate(x,0);
      ctx.fillStyle=PAT.gold;ctx.fillRect(0,0,hw,H);
      ctx.save();ctx.beginPath();ctx.rect(0,470,hw,H-470);ctx.clip();ctx.fillStyle=PAT.sei;ctx.fillRect(0,470,hw,H);ctx.restore();
      ctx.strokeStyle='#d8a640';ctx.lineWidth=4;ctx.beginPath();for(let xx=0;xx<=hw;xx+=10){const y=470+Math.sin(xx*.03+side)*14;xx?ctx.lineTo(xx,y):ctx.moveTo(xx,y);}ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<3;i++)cloud(120+i*150,110+i*60,.6,'rgba(255,250,235,.9)','#c99a2e');
      ctx.fillStyle='#120806';ctx.fillRect(0,0,hw,16);ctx.fillRect(0,H-16,hw,16);ctx.fillRect(side<0?hw-14:0,0,14,H);ctx.fillRect(side<0?0:hw-14,0,14,H);
      const hx=side<0?hw-60:60;ctx.fillStyle='#1a0a06';ctx.beginPath();ctx.ellipse(hx,360,16,30,0,0,TAU);ctx.fill();ctx.strokeStyle='#d8a640';ctx.lineWidth=3;ctx.stroke();
      ctx.restore();}
    if(t>.45&&!tr.fxSlam){tr.fxSlam=1;shake=22;petalBurst(640,360,50,tr.song.theme==='kitsune'?'#bff6ff':tr.song.theme==='raijin'?'#ffe680':'#ffc1d6');if(tr.mid)tr.mid();}
    const a=t<2.25?1:clamp(1-(t-2.25)/.25,0,1);if(t>.5&&a>0){ctx.save();ctx.globalAlpha=a;
      const ck=eOutBack(clamp((t-.5)/.3,0,1));glowCircle(640,330,190*ck,'#d81e2c','rgba(255,60,60,.4)',1.4);
      brushStroke(150,350,980,170,eOutC(clamp((t-.7)/.3,0,1)),'#0b0b0b',17);
      if(t>.92){const k=clamp((t-.92)/.14,0,1),s=lerp(2.4,1,eInC(k));ctx.save();ctx.translate(640,338);ctx.scale(s,s);ctx.globalAlpha=a*k;txt(tr.song.title,0,0,tr.song.title.length>4?118:136,F_BRUSH,'#fff','#000',10);ctx.restore();
        if(!tr.fxT&&k>=1){tr.fxT=1;shake=12;inkBurst(640,340,30,['#0b0b0b','#c8102e']);}}
      if(t>1.15){ctx.globalAlpha=a*clamp((t-1.15)/.25,0,1);txt(tr.song.en+'　·　BPM '+tr.song.bpm,640,432,22,F_BOLD,'#ffd06a');}
      if(t>1.5){const k=clamp((t-1.5)/.14,0,1),s=lerp(3,1,eInC(k));const D=DIFFS[tr.diff];ctx.save();ctx.globalAlpha=a*k;ctx.translate(1010,190);ctx.scale(s,s);hanko(0,0,130,D.k,.14,'#c8102e',9);ctx.restore();
        if(!tr.fxH&&k>=1){tr.fxH=1;shake=16;inkBurst(1010,190,26,['#c8102e']);}
        ctx.globalAlpha=a*k;txt(D.n+'・'+D.zh,1010,282,22,F_BOLD,'#1a0a06');}
      if(t>1.8){ctx.globalAlpha=a*clamp((t-1.8)/.2,0,1);txt('いざ、参る！',300,190,40,F_BRUSH,'#1a0a06');}
      ctx.restore();}
    ctx.fillStyle='rgba(0,0,0,.35)';if(close>.98)ctx.fillRect(637,0,6,H);return;}
  if(tr.kind==='curtain'){const down=t<.7?eOutBounce(t/.7):t<1.25?1:1-eInOut(clamp((t-1.25)/.75,0,1));const y=-H+H*down;
    if(t>=.7&&!tr.fxM){tr.fxM=1;shake=12;if(tr.mid)tr.mid();}
    ctx.save();ctx.translate(0,y);for(let i=0;i<16;i++){const x=i*W/16,w=W/16;const g=ctx.createLinearGradient(x,0,x+w,0);const red=i%2===0;
      g.addColorStop(0,red?'#7a0a14':'#c8c0b0');g.addColorStop(.5,red?'#d8202e':'#fffaf0');g.addColorStop(1,red?'#7a0a14':'#c8c0b0');ctx.fillStyle=g;ctx.fillRect(x,0,w+1,H);}
    ctx.fillStyle='#1a0a06';ctx.fillRect(0,H-20,W,20);for(let i=0;i<W;i+=40){ctx.fillStyle='#d8a640';ctx.beginPath();ctx.arc(i+20,H-10,6,0,TAU);ctx.fill();}
    brushStroke(340,360,600,130,1,'#0b0b0b',23);txt('結果発表',640,358,84,F_BRUSH,'#fff');ctx.restore();return;}}

/* ================================================================
   LOOP
   ================================================================ */
let last=performance.now();
function update(dt){sceneT+=dt;
  if(preview)preview.tick();
  if(previewTimer>0){previewTimer-=dt;if(previewTimer<=0&&scene==='select')startPreview(sel.song);}
  if(scene==='play'&&G)updatePlay(dt);
  if(trans){trans.t+=dt;if(trans.kind==='ink'&&!trans.done&&trans.t>=trans.dur/2){trans.done=true;trans.mid&&trans.mid();}if(trans.t>=trans.dur)trans=null;}
  for(const k in drumFlash)drumFlash[k]=Math.max(0,drumFlash[k]-dt*7);
  updParts(bgP,dt);updParts(fxP,dt);shake=Math.max(0,shake-dt*60);flash=Math.max(0,flash-dt*2.5);
  if(bgP.length>500)bgP.splice(0,bgP.length-500);if(fxP.length>600)fxP.splice(0,fxP.length-600);
  if(scene==='result'&&R&&R.clear&&sceneT>2.4&&Math.random()<dt*1.2)rocket(rnd(640,1240),rnd(100,280),.8,false);}
function render(){ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const t=performance.now()/1000;
  if(scene==='boot')drawBoot(sceneT);
  else if(scene==='intro'){drawIntro(sceneT);drawParts(fxP);}
  else if(scene==='title'){drawTitle(t);drawParts(bgP);drawParts(fxP);}
  else if(scene==='select'){drawSelect(t);drawParts(bgP);drawParts(fxP);}
  else if(scene==='play'&&G){drawPlay(t);}
  else if(scene==='result'&&R){drawResult(sceneT);drawParts(bgP);drawParts(fxP);}
  if(trans)drawTransition();
  ctx.restore();
  if(flash>0){ctx.globalAlpha=flash;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__kodo={SONGS,buildChart,get G(){return G},get scene(){return scene},sel};
